<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AWS Image Preprocessing System</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f4f7fb;
        font-family: Arial, sans-serif;
      }

      .main-container {
        max-width: 750px;
        margin: 80px auto;
      }

      .upload-card {
        border: none;
        border-radius: 15px;
        padding: 35px;
        background-color: white;
      }

      .upload-icon {
        font-size: 50px;
        color: #0d6efd;
      }

      .upload-btn {
        padding: 12px;
        font-weight: 600;
      }

      .subtitle {
        color: #6c757d;
      }

      #imagePreview {
        max-width: 100%;
        max-height: 250px;
        display: none;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <div class="container main-container">
      <!-- Header -->
      <div class="text-center mb-5">
        <h1 class="fw-bold">AWS Image Preprocessing System</h1>

        <p class="subtitle mt-3">
          Upload your images and prepare them for automated preprocessing using
          AWS cloud services.
        </p>
      </div>

      <!-- Upload Card -->
      <div class="card upload-card shadow-sm">
        <div class="text-center mb-4">
          <div class="upload-icon">&#128444;</div>

          <h4 class="fw-bold mt-2">Upload Your Image</h4>

          <p class="text-muted">
            Select an image from your device to get started.
          </p>
        </div>

        <!-- Image Upload Form -->
        <form action="/upload" method="POST" enctype="multipart/form-data">
          <label for="image" class="form-label fw-semibold">
            Choose Image
          </label>

          <input
            type="file"
            id="image"
            name="image"
            class="form-control mb-3"
            accept=".jpg,.jpeg,.png,.webp"
            onchange="previewImage(event)"
            required
          />

          <!-- Image Preview -->
          <div class="text-center mb-3">
            <img
              id="imagePreview"
              src=""
              alt="Image Preview"
              class="rounded shadow-sm"
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 upload-btn">
            Upload Image
          </button>
        </form>

        <div class="text-center mt-4">
          <small class="text-muted">
            Supported formats: JPG, JPEG, PNG and WEBP
          </small>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-4">
        <small class="text-muted">
          Automated Image Preprocessing System Using AWS
        </small>
      </div>
    </div>

    <!-- Image Preview JavaScript -->
    <script>
      function previewImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("imagePreview");

        if (file) {
          const allowedTypes = ["image/jpeg", "image/png", "image/webp"];

          if (!allowedTypes.includes(file.type)) {
            alert("Please select a JPG, JPEG, PNG or WEBP image.");
            event.target.value = "";
            preview.src = "";
            preview.style.display = "none";
            return;
          }

          preview.src = URL.createObjectURL(file);
          preview.style.display = "block";
        } else {
          preview.src = "";
          preview.style.display = "none";
        }
      }
    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
